[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-phoenix-engine"
version = "1.0.0"
description = "Two Operators, Two Laws Per Step — Quantum Phoenix Engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "James Stanley", email = "infinitys.end@icloud.com"},
]
keywords = [
    "quantum",
    "phoenix",
    "state-machine",
    "finite-state-machine",
    "fsm",
    "engine",
    "simulator",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Hydrogenesi/Quantum-Phoenix-Engine"
Repository = "https://github.com/Hydrogenesi/Quantum-Phoenix-Engine.git"
Issues = "https://github.com/Hydrogenesi/Quantum-Phoenix-Engine/issues"
Documentation = "https://github.com/Hydrogenesi/Quantum-Phoenix-Engine/blob/main/README.md"

[project.scripts]
phoenix = "quantum_phoenix.cli:main"

[tool.setuptools]
packages = ["quantum_phoenix"]

[tool.setuptools.package-data]
quantum_phoenix = ["py.typed"]
